<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animasi Kuda di Pantai</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }

    h3 {
      font-size: 1.4rem;
      margin-bottom: 15px;
      text-align: center;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
    }

    .beach-stage {
      position: relative;
      width: 100%;
      max-width: 750px;
      height: 420px;
      border: 8px solid #fff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background: linear-gradient(to bottom, #4fc3f7 0%, #e0f7fa 50%, #29b6f6 50%, #ffe082 80%, #ffd54f 100%);
    }

    .sun {
      position: absolute;
      top: 25px;
      right: 50px;
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #fff7c2 20%, #ffeb3b 100%);
      border-radius: 50%;
      box-shadow: 0 0 40px #ffeb3b, 0 0 80px #ff9800;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      animation: floatCloud 25s linear infinite;
    }

    .cloud::before, .cloud::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
    }

    .cloud1 { top: 30px; left: -100px; width: 100px; height: 30px; }
    .cloud1::before { width: 40px; height: 40px; top: -20px; left: 15px; }
    .cloud1::after { width: 50px; height: 50px; top: -25px; left: 40px; }

    @keyframes floatCloud {
      0% { left: -120px; }
      100% { left: 800px; }
    }

    .wave {
      position: absolute;
      bottom: 75px;
      width: 200%;
      height: 25px;
      background: repeating-linear-gradient(90deg, #0288d1, #0288d1 40px, #4fc3f7 40px, #4fc3f7 80px);
      opacity: 0.6;
      animation: waveMove 4s ease-in-out infinite alternate;
    }

    @keyframes waveMove {
      0% { transform: translateX(0) translateY(0); }
      100% { transform: translateX(-50px) translateY(5px); }
    }

    .palm-tree {
      position: absolute;
      bottom: 80px;
      left: 20px;
      width: 15px;
      height: 140px;
      background: #8d6e63;
      border-radius: 10px;
      transform: rotate(12deg);
      transform-origin: bottom center;
    }

    .palm-leaves {
      position: absolute;
      top: -20px;
      left: -45px;
      width: 100px;
      height: 40px;
      background: #4caf50;
      border-radius: 50% 50% 0 0;
      box-shadow: 0 10px 0 #388e3c;
    }

    .horse-img {
      position: relative;
      z-index: 5;
      height: 230px;
      width: auto;
      cursor: pointer;
      outline: none;
      filter: brightness(1.3) contrast(1.15) drop-shadow(0 10px 12px rgba(0,0,0,0.35));
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.2s ease;
      user-select: none;
      margin-bottom: 10px;
    }

    .horse-img:hover {
      transform: scale(1.06);
      filter: brightness(1.4) contrast(1.2) drop-shadow(0 14px 16px rgba(0,0,0,0.4));
    }

    .horse-img:focus {
      outline: 4px dashed #ffeb3b;
      outline-offset: 8px;
      transform: scale(1.08) translateY(-10px);
    }

    .horse-img:active,
    .horse-img.rearing {
      animation: rearUp 0.8s ease-in-out;
    }

    @keyframes rearUp {
      0% { transform: scale(1.3) translateY(0) rotate(0deg); }
      30% { transform: scale(1.45) translateY(-45px) rotate(-20deg); }
      60% { transform: scale(1.35) translateY(-20px) rotate(-10deg); }
      100% { transform: scale(1.3) translateY(0) rotate(0deg); }
    }

    .hint {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #e0f7fa;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <h3>Click The Horse Or Hit The Tab Key To See Her Run</h3>

  <div class="beach-stage">
    <div class="sun"></div>
    <div class="cloud cloud1"></div>
    <div class="wave"></div>
    
    <div class="palm-tree">
      <div class="palm-leaves"></div>
    </div>
    
    <img tabindex="1" class="horse-img" src="http://cliparts.co/cliparts/8Tz/Byj/8TzByjyTp.gif" alt="Running Horse">
  </div>

  <p class="hint">Tekan tombol <b>Tab</b> lalu <b>Enter/Spasi</b> atau klik langsung pada kuda!</p>

  <script>
    const horse = document.querySelector('.horse-img');

    function playWhinnySound() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = 'sawtooth';
      
      const now = ctx.currentTime;
      osc.frequency.setValueAtTime(750, now);
      osc.frequency.linearRampToValueAtTime(1150, now + 0.15);
      
      // Vibrato effect ("hihihihi")
      for (let i = 0; i < 6; i++) {
        osc.frequency.setValueAtTime(1150, now + 0.15 + i * 0.08);
        osc.frequency.linearRampToValueAtTime(900, now + 0.15 + i * 0.08 + 0.04);
      }
      
      osc.frequency.exponentialRampToValueAtTime(350, now + 0.85);

      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.85);
    }

    horse.addEventListener('click', () => {
      playWhinnySound();
    });

    horse.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        horse.classList.add('rearing');
        playWhinnySound();
        setTimeout(() => horse.classList.remove('rearing'), 800);
      }
    });
  </script>
</body>
</html>
